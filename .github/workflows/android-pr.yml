name: Pull request build
run-name: PR build ${{ github.head_ref }}

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🐘 Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on ubuntu-latest runners.
      - name: ✅ Unit tests + coverage gate (95% on logic)
        run: ./gradlew :app:testDebugUnitTest :app:koverVerifyDebug --no-configuration-cache

      - name: 🏗️ Build debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: ↗️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
