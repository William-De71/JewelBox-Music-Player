name: Pull request build
run-name: PR build ${{ github.head_ref }}

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests & coverage (95%)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🐘 Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: ✅ Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: 📊 Coverage gate (min 95% on logic)
        run: ./gradlew :app:koverVerifyDebug :app:koverHtmlReportDebug --no-configuration-cache

      # Test and coverage reports, downloadable from the run page — also on failure,
      # which is precisely when they matter.
      - name: ↗️ Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/kover/htmlDebug
          retention-days: 7

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🐘 Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on ubuntu-latest runners.
      - name: 🏗️ Build debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: ↗️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
