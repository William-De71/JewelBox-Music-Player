name: Pull request build
run-name: PR build ${{ github.head_ref }}

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests & coverage (95%)
    runs-on: ubuntu-latest
    # Needed by the sticky coverage comment below.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🐘 Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: ✅ Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: 📊 Coverage gate (min 95% on logic)
        run: ./gradlew :app:koverVerifyDebug :app:koverHtmlReportDebug :app:koverXmlReportDebug --no-configuration-cache

      # The coverage table, readable without downloading anything: on the run's
      # summary page, and as a sticky comment kept up to date on the PR.
      - name: 📝 Coverage summary (run page)
        if: always()
        run: |
          python3 .github/scripts/kover_summary.py app/build/reports/kover/reportDebug.xml \
            | tee coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Coverage comment (PR, sticky)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kover-coverage -->';
            let table;
            try {
              table = fs.readFileSync('coverage-summary.md', 'utf8');
            } catch {
              table = '⚠️ Rapport de couverture indisponible (les tests ont probablement échoué avant).';
            }
            const body = `${marker}\n${table}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # Test and coverage reports, downloadable from the run page — also on failure,
      # which is precisely when they matter.
      - name: ↗️ Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/kover/htmlDebug
          retention-days: 7

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🐘 Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on ubuntu-latest runners.
      - name: 🏗️ Build debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: ↗️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
